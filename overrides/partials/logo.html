{#-

  rendered and extra.css shows the one drawn for the current scheme.
-#}
<span class="odys-logo odys-logo--on-dark">
  <img src="{{ 'assets/brand/odys-wordmark-on-dark.svg' | url }}" alt="{{ config.site_name }}">
</span>
<span class="odys-logo odys-logo--on-light">
  <img src="{{ 'assets/brand/odys-wordmark-on-light.svg' | url }}" alt="{{ config.site_name }}">
</span>
