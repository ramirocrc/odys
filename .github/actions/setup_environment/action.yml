name: "Install Python depedencies"
description: "Install Python dependencies using uv and just"
runs:
  using: "composite"
  steps:
    - name: Set up Python 3.15
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: "3.15"

    - name: Setup tools
      uses: ./.github/actions/setup_just_and_uv

    - name: Install dependencies
      run: just install
      shell: bash
