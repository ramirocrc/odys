[project]
name = "odys"
version = "0.2.1"
description = "Python framework for optimizing multi-energy systems."
readme = "README.md"
requires-python = ">=3.11,<4.0"
authors = [{ name = "Ramiro Criach", email = "ramirocriach@gmail.com" }]
keywords = [
  "battery",
  "dispatch",
  "energy",
  "milp",
  "optimization",
  "portfolio",
  "stochastic",
  "uncertainty",
]

license = "MIT"

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
  "highspy>=1.14.0",
  "linopy>=0.7.0",
  "numpy>=2.4.1",
  "pandas>=2.3.3",
  "pydantic>=2.12.5",
  "xarray>=2025.12.0",
]

[project.urls]
Changelog = "https://github.com/ramirocrc/odys/blob/main/CHANGELOG.md"
Documentation = "https://ramirocrc.github.io/odys/"
Homepage = "https://ramirocrc.github.io/odys/"
Issues = "https://github.com/ramirocrc/odys/issues"
Repository = "https://github.com/ramirocrc/odys"

[project.optional-dependencies]
cplex = ["cplex>=22.1.2.1"]
gurobi = ["gurobipy>=13.0.1"]
scip = ["pyscipopt>=6.1.0"]

[dependency-groups]
dev = [
  "basedpyright>=1.39.9",
  "complexipy>=7.0.1",
  "deptry>=0.25.1",
  "import-linter>=2.15",
  "nox>=2026.8.17",
  "prek>=0.4.10",
  "pyrefly>=1.1.1",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.8.0",
  "radon>=6.0.1",
  "ruff>=0.15.22",
  "ty>=0.0.61",
  "vulture>=2.16",
  "zuban>=0.9.0",
]
docs = [
  "mkdocstrings-python>=2.0.1",
  "plotly>=6.0.0",
  "zensical>=0.0.45",
]
vulnerability-fixes = ["virtualenv>=21.7.12"]

[build-system]
requires = ["uv_build<0.13"]
build-backend = "uv_build"

[tool.basedpyright]
include = ["src/"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
# xarray/pandas/linopy are only partially typed; "Unknown" reports would force casts everywhere.
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportMissingTypeStubs = "none"

[tool.complexipy]
paths = ["src"]
max-complexity-allowed = 15
quiet = true

[tool.coverage.report]
skip_empty = true
fail_under = 90

[tool.coverage.run]
branch = true
source = ["src"]

[tool.deptry.per_rule_ignores]
DEP002 = ["highspy", "cplex", "gurobipy", "pyscipopt"]

[tool.importlinter]
root_package = "odys"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain uses no numerical or modeling libraries"
type = "forbidden"
source_modules = ["odys.domain"]
forbidden_modules = ["linopy", "xarray", "numpy", "pandas"]

[[tool.importlinter.contracts]]
name = "Parameters do not use the modeling library"
type = "forbidden"
source_modules = ["odys.parameters"]
forbidden_modules = ["linopy"]

[[tool.importlinter.contracts]]
name = "Domain is independent of the rest of odys"
type = "forbidden"
source_modules = ["odys.domain"]
forbidden_modules = [
  "odys.parameters",
  "odys.optimization",
  "odys.solvers",
  "odys.results",
  "odys.energy_system"
]

[[tool.importlinter.contracts]]
name = "Parameters do not import optimization"
type = "forbidden"
source_modules = ["odys.parameters"]
forbidden_modules = [
  "odys.optimization",
  "odys.solvers",
  "odys.results",
  "odys.energy_system",
]

[[tool.importlinter.contracts]]
name = "Optimization does not depend on solving, results, or the composition root"
type = "forbidden"
source_modules = ["odys.optimization"]
forbidden_modules = ["odys.solvers", "odys.results", "odys.energy_system"]

[[tool.importlinter.contracts]]
name = "Solvers and results do not depend on the composition root"
type = "forbidden"
source_modules = ["odys.solvers", "odys.results"]
forbidden_modules = ["odys.energy_system"]

[[tool.importlinter.contracts]]
name = "Formulations are independent of each other (charging may use electric vehicles)"
type = "independence"
modules = [
  "odys.optimization.formulations.charging",
  "odys.optimization.formulations.electric_vehicle",
  "odys.optimization.formulations.energy_market",
  "odys.optimization.formulations.fixed_load",
  "odys.optimization.formulations.flexible_load",
  "odys.optimization.formulations.generator",
  "odys.optimization.formulations.stationary_storage",
]
ignore_imports = [
  "odys.optimization.formulations.charging -> odys.optimization.formulations.electric_vehicle",
]

[tool.pyrefly]
infer-with-first-use = false

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--strict-config", "-ra"]
filterwarnings = ["error"]
xfail_strict = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "TD",
  "FIX",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "INP001",  # Checks for packages that are missing an __init__.py
  "S101",  # Use of 'assert' detected
  "D",  # Check for missing docstrings
]
"__init__.py" = [
  "F401",
]
"examples/**" = [
  "INP001",  # Checks for packages that are missing an __init__.py
  "S101",  # Use of 'assert' detected
  "D",  # Check for missing docstrings
]
"docs/generate_example_plots.py" = [
  "INP001",  # No __init__.py in docs/
  "E402",  # sys.path manipulation before imports
  "C408",  # plotly API uses dict() extensively
  "T201",  # print() for CLI output is intentional
]
".claude/hooks/**" = [
  "INP001",  # Standalone hook scripts, not a package
  "S603",  # subprocess calls with fixed, trusted argument lists
  "S607",  # uv resolved from PATH
]
"src/odys/results/dispatch.py" = [
  "TC002",  # pandas used at runtime for type-checking
  "TC003",  # Iterator used in runtime for type hints
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Optional".msg = "Use `X | None`."
"typing.Union".msg = "Use `X | Y`."

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
preview = true

[tool.uv.build-backend]
module-name = "odys"

[tool.vulture]
min_confidence = 80
paths = ["src/"]

[tool.zuban]
strict = true
files = ["src", "tests"]
